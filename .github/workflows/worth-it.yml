name: Worth It checks
on:
  pull_request:
    paths: ['worth-it/**', '.github/workflows/worth-it.yml']
  push:
    paths: ['worth-it/**', '.github/workflows/worth-it.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worth-it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worth-it/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run export:web
